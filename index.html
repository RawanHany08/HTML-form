<!DOCTYPE html>
<html>
    <head>
        <title>Emplyee Registration</title>
    </head>
    <body>
        <h2>Register New Employee</h2>
        <!--form-->
        <form>
            <fieldset>
                <!--first name-->
                <legend>Personal Information</legend>
                <label for="name1">First Name:</label>
                <input type="text" id="name1" name="first name">
                <br>
                <!--Last name-->
                  <label for="name2">Last Name:</label>
                <input type="text" id="name2" name="Last name">
                <br>
                <!--date-->
                  <label>Date of Birth</label>
                <input type="date"  >
                <br>
                <!--gender-->
                <label>Gender</label>
                <input type="radio" id="male" name="'gender">
                <label for="male">male</label>
                <input type="radio" id="female" name="'gender">
                <label for="female">female</label>
            </fieldset>
            <!--about-->
            <fieldset>
                <legend>about </legend>
                <label>Bio:</label><br>
                <textarea rows="'4" cols="40" placeholder="Tell us about yourself..."></textarea>
            </fieldset>
            <!--skills-->
            <fieldset>
            <legend>Skills</legend>
            <input type="checkbox" >
            <label>HTML</label><br>
             <input type="checkbox" >
            <label>CSS</label><br>
             <input type="checkbox" >
            <label>Javascript</label><br>
             <input type="checkbox" >
            <label>Angular</label><br>
             <input type="checkbox" >
            <label>React</label><br>
             <input type="checkbox" >
            <label>Node.js</label><br>
             <input type="checkbox" >
            <label>Java</label><br>
            </fieldset>
            <!--profile image-->
            <fieldset>
                <legend>Profile Image</legend>
                <label for="upload">Upload Image</label>
                <input type="file" id="upload">
            </fieldset>
            <!--button-->
            <input type="submit" value="Register Employee">
        </form>
    </body>
</html>
